name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            extras: "test"
          - python: "3.11"
            extras: "test,fast-cc"
          - python: "3.12"
            extras: "test,fast-cc,nnunet"
          # oldest supported versions: torch < 2.3 needs numpy < 2
          - python: "3.10"
            extras: "test,nnunet"
            torch: "==2.0.1"
            pins: '"torch==2.0.1" "numpy<2" "nnunetv2==2.1.2"'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install "torch${{ matrix.torch }}" --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[${{ matrix.extras }}]" ${{ matrix.pins }}
      - name: Test
        run: pytest -q
