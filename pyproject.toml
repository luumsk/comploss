[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "comploss"
version = "0.1.0"
description = "Component-aware loss functions and object-level metrics for segmenting small and multiple structures (CATMIL, CC-DiceCE, ...), with nnU-Net v2 and MONAI support."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Minh Sao Khue Luu" }]
maintainers = [{ name = "Minh Sao Khue Luu" }]
requires-python = ">=3.10"
dependencies = ["torch>=2.0", "numpy", "scipy"]
keywords = ["segmentation", "loss function", "connected components", "small objects", "instance imbalance",
            "medical image segmentation", "nnU-Net", "pytorch"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.optional-dependencies]
nnunet = ["nnunetv2>=2.1"]
monai = ["monai>=1.3"]
fast-cc = ["connected-components-3d>=3.12"]
io = ["nibabel"]
test = ["pytest", "monai>=1.3"]
dev = ["pytest", "monai>=1.3", "ruff", "build", "twine"]

[project.scripts]
comploss = "comploss.cli:main"

[project.urls]
Repository = "https://github.com/luumsk/comploss"
Issues = "https://github.com/luumsk/comploss/issues"
Changelog = "https://github.com/luumsk/comploss/blob/main/CHANGELOG.md"
"CATMIL paper code" = "https://github.com/luumsk/SmallLesionMRI"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
# frozen verbatim copies of research code, kept as-is for the parity tests
extend-exclude = ["tests/_reference_losses.py", "tests/_reference_metrics.py"]
